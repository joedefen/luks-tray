name: CI

# Three gates, each cheap enough to run on every push and pull request:
#   lint    -- the in-repo ruff configuration (pyproject.toml), no user config
#   test    -- pytest on every supported Python, with real PyQt6 on the
#              offscreen platform, and branch coverage measured
#   package -- build sdist+wheel, inspect them with the same inspector ./bless
#              uses, then install the wheel and run what it installed
#
# ./bless runs these same three gates locally before it offers to upload, so a
# release cannot be greener than its own CI.  Nothing here can publish: the
# upload is irreversible and stays a deliberate action from the tree, which is
# why this workflow holds no credentials at all.

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"
  # A runner has no display.  conftest.py sets this too, so a bare `pytest`
  # works as well; setting it here makes the choice visible in the job log.
  QT_QPA_PLATFORM: offscreen

jobs:
  lint:
    name: lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ruff
        run: |
          python -m pip install --upgrade pip
          python -m pip install ruff

      - name: Run the lint gate
        run: ruff check --output-format=github .

  test:
    name: pytest (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # PyQt6 wheels bundle Qt but not the system libraries Qt links against.
      # Without these, importing QtWidgets aborts the process instead of
      # raising, which would look like a test bug rather than a missing package.
      - name: Install the Qt system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1 libegl1 libxkbcommon0 libdbus-1-3

      - name: Install the project and its dev extra
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Byte-compile every module
        run: python -m compileall -q luks_tray tests conftest.py

      - name: Report the Qt platform the suite will use
        run: |
          python - <<'PY'
          import os
          import sys

          print(f'python {sys.version.split()[0]}')
          print(f'QT_QPA_PLATFORM={os.environ.get("QT_QPA_PLATFORM")}')
          PY

      # The coverage floor is not repeated here: pytest-cov reads `fail_under`
      # from [tool.coverage.report] in pyproject.toml, so the number a developer
      # gets locally and the number CI enforces are the same one.
      # `term-missing` is what makes the log answer "which branches has nobody
      # written a test for", not just "how many tests ran".
      - name: Run the tests with coverage
        run: python -m pytest -v --cov=luks_tray --cov-report=term-missing

  package:
    name: packaging smoke test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # The installed console script imports Qt, so this job needs them too.
      - name: Install the Qt system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1 libegl1 libxkbcommon0 libdbus-1-3

      - name: Install the build tool
        run: |
          python -m pip install --upgrade pip
          python -m pip install build

      - name: Build sdist and wheel
        run: python -m build

      # The same inspector ./bless runs before an upload, so CI and the
      # maintainer cannot disagree about what a valid artifact is.  It reads the
      # expected metadata from pyproject.toml and luks_tray/__init__.py, never
      # from the artifact it is checking.
      - name: Inspect the built distributions
        run: python tests/inspect_dist.py dist/*.whl dist/*.tar.gz

      - name: Install the wheel into a clean virtualenv
        run: |
          python -m venv /tmp/luks-tray-wheel
          /tmp/luks-tray-wheel/bin/python -m pip install --upgrade pip
          /tmp/luks-tray-wheel/bin/python -m pip install dist/*.whl

      - name: Import the installed package and check its resources
        run: |
          /tmp/luks-tray-wheel/bin/python - <<'PY'
          import importlib.resources

          import luks_tray

          assert luks_tray.__version__

          resources = importlib.resources.files('luks_tray.resources')
          for name in ('alert-shield-v04.svg', 'green-shield-v04.svg',
                       'orange-shield-v04.svg', 'white-shield-v04.svg',
                       'yellow-shield-v04.svg'):
              assert resources.joinpath(name).is_file(), name

          print(f'installed package OK: luks_tray {luks_tray.__version__}')
          PY

      # `--version` is the same probe ./bless uses in its smoke stage: it has to
      # answer from the installed package, before any config, dialog or tray is
      # built.
      - name: Exercise the installed console script
        run: |
          version=$(/tmp/luks-tray-wheel/bin/python -c \
            'import luks_tray; print(luks_tray.__version__)')
          /tmp/luks-tray-wheel/bin/luks-tray --version | grep -F "$version"
