# luks-tray -- packaging, the release gate and the development loop
# ================================================================
#
# Sources of truth
# ----------------
# * Build backend: flit_core.  The version lives in
#   `luks_tray/__init__.py:__version__` and nowhere else; never add `version =`
#   to [project].  tests/test_metadata.py enforces this, because a second copy
#   of the version is how the published metadata drifted from the code before.
# * Layout: the package is `luks_tray/`; the tray icons it loads at run time
#   live under `luks_tray/resources/` and ride in the wheel.
# * `luks-tray` is the console script (`luks_tray.Main:main`), and `--version`
#   prints that same line, which is what ./bless' smoke install reads back out
#   of the built wheel.
#
# Development
# -----------
# `./runner` runs this tree without installing it.  For the install layout, the
# test inventory and the release checklist in detail, see
# tests/README-DEV.md; the essentials:
#
#   python3 -m venv .venv
#   .venv/bin/python -m pip install -e '.[dev]'
#   .venv/bin/python -m ruff check .
#   .venv/bin/python -m compileall -q luks_tray tests
#   .venv/bin/python -m pytest -q --cov=luks_tray --cov-report=term-missing
#
# That last line is the test gate CI runs.  It is not only a count of tests: the
# coverage floor in [tool.coverage.report] is read by pytest-cov itself, so a
# developer and CI cannot enforce different numbers.
#
# Releasing
# ---------
# `./bless` is the only path to an upload, and it takes no argument and no flag.
# Every run refuses a dirty tree, refuses a version that is already published,
# runs ruff, compileall and pytest, builds into a fresh build/bless-<version>/,
# inspects the two files with tests/inspect_dist.py -- the same inspector CI
# uses -- runs `twine check --strict`, installs the wheel in a scratch venv and
# runs it, and only then asks `====> Enter test or publish or quit:`.  `test`
# uploads a throwaway X.Y.Z.99.N to TestPyPI from a copy of the tree; `publish`
# makes main and dev one commit, tags vX.Y.Z, uploads to PyPI and pushes.
#
# Run it as `.venv/bin/python ./bless`: the gates run sys.executable, and the
# system python3 has no PyQt6 for the tests to import.

[build-system]
# 3.12 is the first flit_core that understands the PEP 639 SPDX
# `license = "MIT"` string and `license-files` below; older 3.x rejects both.
requires = ["flit_core >=3.12,<4"]
build-backend = "flit_core.buildapi"

[project]
# flit_core reads `__version__` from `luks_tray/__init__.py` at build time, so
# the release number is never duplicated here.
dynamic = ["version"]
name = "luks-tray"
description = "A Qt-based tray app for managing LUKS encrypted volumes"
authors = [
    { name = "Joe Defen", email = "joedef@gmail.com" }
]
readme = "README.md"
# PEP 639: an SPDX expression, not the deprecated `{ file = "LICENSE" }` table.
# `License ::` classifiers must not accompany it, so the MIT classifier is gone;
# the licence text still ships via `license-files`.
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"

keywords = ["LUKS", "Qt6", "applet", "tray"]

classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Environment :: X11 Applications :: Qt",
    "Operating System :: POSIX :: Linux",
    "Intended Audience :: End Users/Desktop",
    "Topic :: System :: Filesystems"
]

dependencies = [
    "psutil",
    "PyQt6",
    "cryptography",
    "petname",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    # pytest-cov reads `fail_under` from the coverage configuration below, so
    # the pytest command CI runs does not carry a second copy of the floor.
    "pytest-cov>=5",
    "ruff>=0.6",
    "build>=1.2",
    # The validator must be at least as new as the writer: flit_core 3.12 emits
    # PEP 639 licence metadata, which older packaging/twine releases reject as
    # malformed.  twine earns its place beside flit because flit publishes
    # whatever it just rebuilt, while ./bless sends two named, inspected files.
    "twine>=7",
    "packaging>=26",
]

[project.urls]
Homepage = "https://github.com/joedefen/luks-tray"
"Bug Tracker" = "https://github.com/joedefen/luks-tray/issues"

[project.scripts]
luks-tray = "luks_tray.Main:main"

[tool.flit.sdist]
# The tests are part of the contract: an sdist that cannot run its own gate
# leaves a downstream packager guessing.  tests/test_repo_hygiene.py asserts
# both entries are still here.
include = ["tests/", "conftest.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
# Branch coverage: the misses that matter here are the arms of an `if` nobody
# takes (the container state machine, the mount/unmount error paths), not only
# statements nobody executes.
branch = true
source = ["luks_tray"]

[tool.coverage.report]
# `fail_under` is set once the suite has been measured, then only raised.
show_missing = true
skip_covered = true
precision = 1

[tool.ruff]
# Keep the lint gate identical on every machine: no global or user config can
# change which rules CI enforces.
target-version = "py311"
line-length = 100
extend-exclude = ["build", "dist", ".venv"]

[tool.ruff.lint]
# The selection is pinned rather than inherited.  `ruff check .` with no flags
# enforces whatever the installed ruff calls its default, and that set has grown
# across releases: 0.17 adds pyupgrade, isort, simplify, blind-except, shebang
# and the `ruff`-specific rules, which report about 50 pre-existing findings
# across the package.  Pinning here means ./bless, CI and a developer
# run one rule set -- the one the code has always been kept clean under -- and a
# ruff upgrade cannot turn the release gate red by deciding to prefer different
# style.  Widening it is a TODO in README.md, not smuggled in here.
select = ["E4", "E7", "E9", "F"]
# Project style: module files are CamelCase -- `History.py`, `IniTool.py`,
# `Utils.py`, `DeviceInfo.py`, `LuksOps.py`, `Main.py` and every dialog. That is
# deliberate and uniform across the package, so pep8-naming's N999 ("invalid
# module name") is switched off for any config-driven selection that includes
# pep8-naming; the rest of that ruleset stays available. Asking for the rule by
# name on the command line (`--select N999`) still reports it -- an explicit
# request wins over `ignore`, which is the documented behaviour and not a
# problem, because such a run is a question about the rule, not about the code.
ignore = ["N999"]
