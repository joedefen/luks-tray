[build-system]
# 3.12 is the first flit_core that understands the PEP 639 SPDX
# `license = "MIT"` string and `license-files` below; older 3.x rejects both.
requires = ["flit_core >=3.12,<4"]
build-backend = "flit_core.buildapi"

[project]
version = "2.0.5"
name = "luks-tray"
description = "A Qt-based tray app for managing LUKS encrypted volumes"
authors = [
    { name = "Joe Defen", email = "joedef@gmail.com" }
]
readme = "README.md"
# PEP 639: an SPDX expression, not the deprecated `{ file = "LICENSE" }` table.
# `License ::` classifiers must not accompany it, so the MIT classifier is gone;
# the licence text still ships via `license-files`.
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"

keywords = ["LUKS", "Qt6", "applet", "tray"]

classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Environment :: X11 Applications :: Qt",
    "Operating System :: POSIX :: Linux",
    "Intended Audience :: End Users/Desktop",
    "Topic :: System :: Filesystems"
]

dependencies = [
    "psutil",
    "PyQt6",
    "cryptography",
    "petname",
]

[project.urls]
Homepage = "https://github.com/joedefen/luks-tray"
"Bug Tracker" = "https://github.com/joedefen/luks-tray/issues"

[project.scripts]
luks-tray = "luks_tray.Main:main"

[tool.ruff.lint]
# Project style: module files are CamelCase -- `History.py`, `IniTool.py`,
# `Utils.py`, `DeviceInfo.py`, `LuksOps.py`, `Main.py` and every dialog. That is
# deliberate and uniform across the package, so pep8-naming's N999 ("invalid
# module name") is switched off for any config-driven selection that includes
# pep8-naming; the rest of that ruleset stays available. Asking for the rule by
# name on the command line (`--select N999`) still reports it -- an explicit
# request wins over `ignore`, which is the documented behaviour and not a
# problem, because such a run is a question about the rule, not about the code.
ignore = ["N999"]
